name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Installer les dépendances
        run: uv sync

      - name: Lancer les tests
        run: uv run pytest -v
